[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-server-manager"
version = "0.1.17"
requires-python = ">=3.10"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.3", "httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["manager"]

[tool.setuptools.package-data]
manager = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
